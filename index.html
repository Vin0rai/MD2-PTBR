<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sorteio de Cartas - TURBAS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #fff;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    #pilhas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .pilha {
      background: #333;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.2s;
      font-weight: bold;
    }

    .pilha:hover {
      background: #555;
    }

    #cartas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .carta {
      width: 140px;
      border-radius: 8px;
      border: 2px solid #444;
    }

    button {
      display: block;
      margin: 25px auto;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #a00;
      color: #fff;
    }

    button:hover {
      background: #c00;
    }
  </style>
</head>
<body>

<h1>Sorteio de Cartas – TURBAS</h1>

<div id="pilhas">
  <div class="pilha" data-pilha="1">TURBA 1–2</div>
  <div class="pilha" data-pilha="2">TURBA 3–4</div>
  <div class="pilha" data-pilha="3">TURBA 5</div>
  <div class="pilha" data-pilha="4">TURBA 6–7</div>
  <div class="pilha" data-pilha="5">TURBA 8–9</div>
  <div class="pilha" data-pilha="6">TURBA 10</div>
</div>

<h2>Cartas Reveladas</h2>
<div id="cartas"></div>

<button id="limpar">Apagar Cartas Reveladas</button>

<script>
  // CONFIGURAÇÃO DAS PILHAS
  const pilhas = {
    1: {
      nome: "TURBA 1-2",
      pasta: "TURBA-1-2",
      cartas: ["1a.png", "1b.png"]
    },
    2: {
      nome: "TURBA 3-4",
      pasta: "TURBA-3-4",
      cartas: ["2a.png", "2b.png"]
    },
    3: {
      nome: "TURBA 5",
      pasta: "TURBA-5",
      cartas: ["5.png"]
    },
    4: {
      nome: "TURBA 6-7",
      pasta: "TURBA-6-7",
      cartas: ["6.png"]
    },
    5: {
      nome: "TURBA 8-9",
      pasta: "TURBA-8-9",
      cartas: ["8.png"]
    },
    6: {
      nome: "TURBA 10",
      pasta: "TURBA-10",
      cartas: ["10.png"]
    }
  };

  function sortearCarta(pilhaId) {
    const cartas = pilhas[pilhaId].cartas;
    const indice = Math.floor(Math.random() * cartas.length);
    return cartas[indice];
  }

  function salvarCarta(pilhaId, carta) {
    const salvas = JSON.parse(localStorage.getItem("cartas")) || [];

    salvas.push({
      pilhaId,
      pasta: pilhas[pilhaId].pasta,
      carta
    });

    localStorage.setItem("cartas", JSON.stringify(salvas));
  }

  function renderizarCartas() {
    const container = document.getElementById("cartas");
    container.innerHTML = "";

    const salvas = JSON.parse(localStorage.getItem("cartas")) || [];

    salvas.forEach(c => {
      const img = document.createElement("img");
      img.src = `cartas/${c.pasta}/${c.carta}`;
      img.className = "carta";
      container.appendChild(img);
    });
  }

  document.querySelectorAll(".pilha").forEach(pilha => {
    pilha.addEventListener("click", () => {
      const pilhaId = pilha.dataset.pilha;
      const carta = sortearCarta(pilhaId);
      salvarCarta(pilhaId, carta);
      renderizarCartas();
    });
  });

  document.getElementById("limpar").addEventListener("click", () => {
    localStorage.removeItem("cartas");
    renderizarCartas();
  });

  // Renderiza automaticamente ao abrir a página
  renderizarCartas();
</script>

</body>
</html>
